<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>育児ログダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1ED; --surface: #FFFFFF; --surface-2: #F6F8F5; --text: #262A26; --text-muted: #6D786F;
    --accent-feed: #5F8B67; --accent-feed-soft: #E3EDE4; --accent-sleep: #4A5B94; --accent-sleep-soft: #DDE1F2;
    --accent-diaper: #B9832F; --accent-diaper-soft: #F3E8D4; --danger: #B4503C; --danger-soft: #F5E2DD;
    --ring-track: #DEE5DD; --grid-line: #E4E9E3;
    --card-shadow: 0 1px 3px rgba(38,42,38,0.06), 0 1px 1px rgba(38,42,38,0.04);
    --radius-lg: 18px; --radius-md: 14px; --radius-sm: 9px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191C19; --surface: #21251F; --surface-2: #262B24; --text: #E9ECE7; --text-muted: #9BA69C;
      --accent-feed: #7FAE87; --accent-feed-soft: #2A3A2C; --accent-sleep: #8892C9; --accent-sleep-soft: #2A2E45;
      --accent-diaper: #D4A657; --accent-diaper-soft: #3A3020; --danger: #D98A76; --danger-soft: #402823;
      --ring-track: #333A31; --grid-line: #2C322A; --card-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #191C19; --surface: #21251F; --surface-2: #262B24; --text: #E9ECE7; --text-muted: #9BA69C;
    --accent-feed: #7FAE87; --accent-feed-soft: #2A3A2C; --accent-sleep: #8892C9; --accent-sleep-soft: #2A2E45;
    --accent-diaper: #D4A657; --accent-diaper-soft: #3A3020; --danger: #D98A76; --danger-soft: #402823;
    --ring-track: #333A31; --grid-line: #2C322A; --card-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; padding: 20px 14px 44px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  .top .date { font-size: 15px; font-weight: 700; color: var(--text); }
  .top .title { font-size: 17px; font-weight: 900; margin: 2px 0 0; }
  .icon-btn { background: var(--surface); border: none; box-shadow: var(--card-shadow); border-radius: 999px;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: 14px; color: var(--text-muted); flex: none; }
  .icon-btn:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent-feed); outline-offset: 2px; }

  .card { background: var(--surface); box-shadow: var(--card-shadow); border-radius: var(--radius-lg); padding: 14px 16px 16px; margin-bottom: 10px; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .card-head .c-title { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
  .card-head .c-sub { font-size: 12.5px; color: var(--text-muted); font-weight: 500; }
  .card-head .c-sub strong { color: var(--text); font-weight: 700; }

  /* Milk card: ring left, mini-stats right */
  .milk-body { display: flex; align-items: center; gap: 14px; }
  .ring-wrap { position: relative; width: 126px; height: 126px; flex: none; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-center .big { font-size: 21px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .ring-center .sub { font-size: 10px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }

  .mini-stats { flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .mini-stat { background: var(--surface-2); border-radius: var(--radius-md); padding: 8px 11px; text-align: left; }
  .mini-stat.highlight { background: var(--accent-feed-soft); }
  .mini-stat.highlight.overdue { background: var(--danger-soft); }
  .mini-stat .m-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .mini-stat .m-label { font-size: 10.5px; color: var(--text-muted); font-weight: 500; }
  .mini-stat .m-time { font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .mini-stat .m-sub { font-size: 10.5px; color: var(--text-muted); font-weight: 500; }
  .mini-stat .m-sub.danger { color: var(--danger); }

  .avg-row { margin-top: 10px; font-size: 12px; color: var(--text); text-align: center; }
  .avg-row strong { font-weight: 700; }
  .avg-sub { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }
  .trend-row { display: none; margin-top: 8px; align-items: center; justify-content: center; gap: 10px; }
  .trend-label { font-size: 10.5px; color: var(--text-muted); text-align: right; line-height: 1.4; }
  .state-msg-hero { text-align: center; padding: 24px 10px; color: var(--text-muted); font-size: 13px; }

  /* Sleep card */
  .sleep-total { font-size: 15px; font-weight: 900; color: var(--accent-sleep); }
  .sleep-state { font-size: 17px; font-weight: 900; margin-bottom: 10px; }
  .sleep-state.asleep { color: var(--accent-sleep); }
  .sleep-state.awake { color: var(--text-muted); }
  .bar-track { width: 100%; height: 9px; background: var(--ring-track); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent-sleep); border-radius: 999px; transition: width 0.5s ease; }
  .sleep-row2 { display: flex; justify-content: space-between; margin-top: 7px; font-size: 11.5px; color: var(--text-muted); }
  .sleep-row2 .remain strong { color: var(--text); font-weight: 700; }

  /* Counts (pee/poop) */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
  .stat-card { background: var(--surface); box-shadow: var(--card-shadow); border-radius: var(--radius-md); padding: 12px 10px; text-align: center; }
  .stat-card .emoji { font-size: 18px; margin-bottom: 4px; }
  .stat-card .num { font-size: 18px; font-weight: 900; }
  .stat-card .cap { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

  .timeline-toggle { width: 100%; background: var(--surface); box-shadow: var(--card-shadow); border: none; border-radius: var(--radius-md);
    padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 13px;
    color: var(--text); font-family: inherit; font-weight: 500; }
  .timeline-toggle .chev { transition: transform 0.25s ease; color: var(--text-muted); }
  .timeline-toggle.open .chev { transform: rotate(180deg); }
  .timeline-wrap { display: none; background: var(--surface); box-shadow: var(--card-shadow); border-radius: var(--radius-md); margin-top: 8px; padding: 10px 12px 12px; }
  .timeline-wrap.open { display: block; }
  .legend { display: flex; gap: 12px; font-size: 10.5px; color: var(--text-muted); margin-bottom: 8px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .day-grid-scroll { max-height: 380px; overflow-y: auto; position: relative; border-top: 1px solid var(--grid-line); }
  .day-grid { position: relative; }
  .hour-row { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid-line); }
  .hour-row .hlabel { position: absolute; left: 0; top: -7px; font-size: 10px; color: var(--text-muted); background: var(--surface); padding-right: 4px; }
  .sleep-block { position: absolute; border-radius: 5px; background: var(--accent-sleep-soft); border-left: 3px solid var(--accent-sleep); }
  .evt-dot { position: absolute; width: 15px; height: 15px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 8.5px; transform: translate(-50%, -50%); }
  .evt-dot.feed { background: var(--accent-feed-soft); }
  .evt-dot.pee { background: #DCEAF5; }
  .evt-dot.poop { background: var(--accent-diaper-soft); }
  .now-line { position: absolute; left: 40px; right: 0; border-top: 2px solid var(--danger); z-index: 3; }
  .now-line::before { content: ''; position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
  .t-empty { padding: 26px 0; text-align: center; color: var(--text-muted); font-size: 12.5px; }

  .footer-note { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 12px; }
  .refresh-btn { background: none; border: none; color: var(--text-muted); font-size: 11px; text-decoration: underline; cursor: pointer; padding: 0; font-family: inherit; }

  .overlay { position: fixed; inset: 0; background: rgba(20, 22, 20, 0.42); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .overlay.open { display: flex; }
  .panel { background: var(--surface); width: 100%; max-width: 480px; border-radius: 22px 22px 0 0; padding: 22px 20px 26px; }
  @media (min-width: 540px) { .overlay { align-items: center; } .panel { border-radius: var(--radius-lg); } }
  .panel h2 { font-size: 17px; font-weight: 900; margin: 0 0 6px; }
  .panel p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin: 0 0 14px; }
  .panel input[type="url"], .panel input[type="number"] { width: 100%; padding: 11px 12px; border: 1px solid var(--grid-line);
    border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text); font-size: 13.5px; font-family: inherit; margin-bottom: 10px; }
  .panel label { font-size: 12.5px; color: var(--text-muted); display: block; margin-bottom: 4px; }
  .field { margin-bottom: 14px; }
  .panel .actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn { flex: 1; padding: 11px; border-radius: var(--radius-sm); border: none; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--accent-feed); color: #fff; }
  .btn-ghost { background: var(--surface-2); color: var(--text); }
  .panel .err { background: var(--danger-soft); color: var(--danger); padding: 10px 12px; border-radius: var(--radius-sm); font-size: 12.5px; margin-bottom: 12px; display: none; }
  .panel .err.show { display: block; }
  .state-msg { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 13.5px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="date" id="todayLabel">—</div>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="設定" title="設定">⚙️</button>
  </div>

  <div id="stateArea"></div>
  <div id="dashboard" style="display:none;">

    <!-- 1: 今日のミルク -->
    <div class="card" id="milkCard">
      <div class="card-head">
        <div class="c-title">🍼 今日のミルク</div>
        <div class="c-sub" id="feedTodayLine">—</div>
      </div>
      <div id="milkBody">
        <div class="milk-body">
          <div class="ring-wrap">
            <svg width="126" height="126" viewBox="0 0 126 126">
              <circle cx="63" cy="63" r="54" fill="none" stroke="var(--ring-track)" stroke-width="11"/>
              <circle id="ringProgress" cx="63" cy="63" r="54" fill="none" stroke="var(--accent-feed)"
                      stroke-width="11" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3"
                      style="transition: stroke-dashoffset 0.6s ease, stroke 0.3s ease;"/>
            </svg>
            <div class="ring-center">
              <div class="big" id="ringBig">—</div>
              <div class="sub" id="ringSub">データ待ち</div>
            </div>
          </div>
          <div class="mini-stats" id="miniStats" style="display:none;">
            <div class="mini-stat">
              <div class="m-row"><span class="m-label">前回</span><span class="m-time" id="lastTime">—</span></div>
              <div class="m-sub" id="lastElapsed">—</div>
            </div>
            <div class="mini-stat highlight" id="nextStat">
              <div class="m-row"><span class="m-label" id="nextLabel">次回の目安</span><span class="m-time" id="nextTime">—</span></div>
              <div class="m-sub" id="nextSub">—</div>
            </div>
          </div>
        </div>
        <div class="avg-row" id="avgRow" style="display:none;">
          <div id="avgMain">—</div>
          <div class="avg-sub" id="avgSub">—</div>
        </div>
        <div class="trend-row" id="trendRow">
          <svg id="trendSpark" width="110" height="28" viewBox="0 0 110 28"></svg>
          <div class="trend-label" id="trendDelta">—</div>
        </div>
      </div>
    </div>

    <!-- 2: 今日の睡眠 -->
    <div class="card" id="sleepCard">
      <div class="card-head">
        <div class="c-title">🌙 今日の睡眠</div>
        <div class="c-sub sleep-total" id="sleepVal">—</div>
      </div>
      <div class="sleep-state" id="sleepStateLine">—</div>
      <div class="bar-track"><div class="bar-fill" id="sleepBar" style="width:0%;"></div></div>
      <div class="sleep-row2">
        <span>目標 <span id="sleepTargetLabel">14</span>時間</span>
        <span class="remain" id="sleepRemain">—</span>
      </div>
    </div>

    <!-- 3: 今日の回数（おしっこ・うんち） -->
    <div class="stats">
      <div class="stat-card">
        <div class="emoji">💧</div>
        <div class="num" id="peeNum">—</div>
        <div class="cap">おしっこ（今日）</div>
      </div>
      <div class="stat-card">
        <div class="emoji">💩</div>
        <div class="num" id="poopNum">—</div>
        <div class="cap">うんち（今日）</div>
      </div>
    </div>

    <!-- 4: タイムライン -->
    <button class="timeline-toggle" id="timelineToggle">
      <span>今日のタイムラインを見る</span>
      <span class="chev">▾</span>
    </button>
    <div class="timeline-wrap" id="timelineWrap">
      <div class="legend">
        <span><i class="sw" style="background:var(--accent-sleep);"></i>ねんね</span>
        <span>🍼 ミルク</span>
        <span>💧 おしっこ</span>
        <span>💩 うんち</span>
        <span><i class="sw" style="background:var(--danger); width:8px; height:8px; border-radius:50%;"></i>現在時刻</span>
      </div>
      <div class="day-grid-scroll" id="dayGridScroll">
        <div class="day-grid" id="dayGrid"></div>
      </div>
    </div>

    <div class="footer-note">
      <span id="lastUpdated">—</span>　·　<button class="refresh-btn" id="refreshBtn">今すぐ更新</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="panelTitle">データフィードを設定</h2>
    <p id="panelDesc">ぴよログアプリの「設定 → データフィード」で発行したURLをここに貼り付けてください。URLはこの端末のブラウザ内にだけ保存され、どこにも送信されません。</p>
    <div class="err" id="panelErr"></div>
    <div class="field">
      <label for="feedUrlInput">データフィードURL</label>
      <input type="url" id="feedUrlInput" placeholder="https://feed.piyolog.com/v1/feed/...">
    </div>
    <div class="field">
      <label for="sleepTargetInput">目標睡眠時間（時間）</label>
      <input type="number" id="sleepTargetInput" min="1" max="24" step="0.5" value="14">
    </div>
    <div class="actions">
      <button class="btn btn-ghost" id="panelCancel">キャンセル</button>
      <button class="btn btn-primary" id="panelSave">保存する</button>
    </div>
  </div>
</div>

<script>
(function () {
  var STORAGE_KEY = 'piyolog_dashboard_feed_url';
  var TARGET_KEY = 'piyolog_dashboard_sleep_target_h';
  var LOG_KEY = 'piyolog_dashboard_interval_log';
  var REFRESH_MS = 90 * 1000;
  var RING_CIRC = 2 * Math.PI * 54;
  var ROW_H = 36;
  var DAY_MIN = 1440;
  var GRID_H = 24 * ROW_H;
  var DAY_START_HOUR = 6;
  var DAY_END_HOUR = 21;

  var els = {};
  ['stateArea','dashboard','todayLabel','ringProgress','ringBig','ringSub','feedTodayLine',
   'miniStats','lastTime','lastElapsed','nextStat','nextLabel','nextTime','nextSub',
   'avgRow','avgMain','avgSub','trendRow','trendSpark','trendDelta',
   'peeNum','poopNum','sleepVal','sleepStateLine','sleepBar','sleepTargetLabel','sleepRemain',
   'timelineToggle','timelineWrap','dayGridScroll','dayGrid','lastUpdated','refreshBtn',
   'settingsBtn','overlay','panelErr','feedUrlInput','sleepTargetInput','panelSave',
   'panelCancel','panelTitle','panelDesc'
  ].forEach(function (id) { els[id] = document.getElementById(id); });

  var refreshTimer = null;

  function safeGet(key) { try { return window.localStorage.getItem(key); } catch (e) { return null; } }
  function safeSet(key, val) { try { window.localStorage.setItem(key, val); return true; } catch (e) { return false; } }
  function getFeedUrl() { return safeGet(STORAGE_KEY) || ''; }
  function getSleepTargetHours() { var v = parseFloat(safeGet(TARGET_KEY)); return isFinite(v) && v > 0 ? v : 14; }

  function fmtToday() {
    var d = new Date();
    var days = ['日','月','火','水','木','金','土'];
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + days[d.getDay()] + '）';
  }
  function fmtHM(mins) {
    var m = Math.round(Math.abs(mins));
    var h = Math.floor(m / 60); var mm = m % 60;
    if (h > 0) return h + '時間' + mm + '分';
    return mm + '分';
  }
  function fmtClock(date) { var h = date.getHours(), m = date.getMinutes(); return h + ':' + (m < 10 ? '0' + m : m); }
  function dayBounds(ref) {
    var d = new Date(ref);
    var start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, 0, 0, 0);
    var end = new Date(start.getTime() + 24 * 3600 * 1000);
    return { start: start, end: end };
  }
  function minutesSinceMidnight(date, dayStart) { return (date.getTime() - dayStart.getTime()) / 60000; }
  function dateStr(d) {
    d = d || new Date();
    var y = d.getFullYear(), m = ('0' + (d.getMonth() + 1)).slice(-2), dd = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + dd;
  }
  function isDayHour(hr) { return hr >= DAY_START_HOUR && hr < DAY_END_HOUR; }

  function getAvgLog() { try { var raw = window.localStorage.getItem(LOG_KEY); return raw ? JSON.parse(raw) : []; } catch (e) { return []; } }
  function upsertAvgLog(dstr, dayAvg, nightAvg) {
    try {
      var log = getAvgLog();
      var idx = -1;
      for (var i = 0; i < log.length; i++) { if (log[i].date === dstr) { idx = i; break; } }
      var entry = { date: dstr, day: (typeof dayAvg === 'number' ? dayAvg : null), night: (typeof nightAvg === 'number' ? nightAvg : null) };
      if (idx >= 0) log[idx] = entry; else log.push(entry);
      log.sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
      if (log.length > 90) log = log.slice(log.length - 90);
      window.localStorage.setItem(LOG_KEY, JSON.stringify(log));
      return log;
    } catch (e) { return getAvgLog(); }
  }

  function openPanel(isFirstRun) {
    els.feedUrlInput.value = getFeedUrl();
    els.sleepTargetInput.value = getSleepTargetHours();
    els.panelErr.classList.remove('show');
    if (isFirstRun) { els.panelTitle.textContent = 'データフィードを設定しよう'; els.panelCancel.style.display = 'none'; }
    else { els.panelTitle.textContent = '設定'; els.panelCancel.style.display = ''; }
    els.overlay.classList.add('open');
  }
  function closePanel() { els.overlay.classList.remove('open'); }

  els.settingsBtn.addEventListener('click', function () { openPanel(false); });
  els.panelCancel.addEventListener('click', closePanel);
  els.panelSave.addEventListener('click', function () {
    var url = els.feedUrlInput.value.trim();
    var target = parseFloat(els.sleepTargetInput.value);
    if (!url || !/^https:\/\//.test(url)) { els.panelErr.textContent = '正しいURL（https://から始まるもの）を入力してください。'; els.panelErr.classList.add('show'); return; }
    if (!isFinite(target) || target <= 0) target = 14;
    var okUrl = safeSet(STORAGE_KEY, url);
    safeSet(TARGET_KEY, String(target));
    if (!okUrl) { els.panelErr.textContent = 'この端末に保存できませんでした。プライベートモードなどでは保存されない場合があります。'; els.panelErr.classList.add('show'); return; }
    closePanel(); loadAndRender();
  });

  els.timelineToggle.addEventListener('click', function () {
    var open = els.timelineWrap.classList.toggle('open');
    els.timelineToggle.classList.toggle('open', open);
    if (open) requestAnimationFrame(scrollTimelineToNow);
  });
  els.refreshBtn.addEventListener('click', function () { loadAndRender(); });

  function showState(html) { els.dashboard.style.display = 'none'; els.stateArea.innerHTML = '<div class="state-msg">' + html + '</div>'; }

  function classifyIntervals(formulaAll) {
    var dayVals = [], nightVals = [], allVals = [];
    for (var i = 1; i < formulaAll.length; i++) {
      var startT = new Date(formulaAll[i - 1].datetime);
      var durMin = (new Date(formulaAll[i].datetime) - startT) / 60000;
      allVals.push(durMin);
      if (isDayHour(startT.getHours())) dayVals.push(durMin); else nightVals.push(durMin);
    }
    function avg(arr) { return arr.length ? arr.reduce(function (a, b) { return a + b; }, 0) / arr.length : null; }
    return { dayAvg: avg(dayVals), nightAvg: avg(nightVals), overallAvg: avg(allVals), dayCount: dayVals.length, nightCount: nightVals.length };
  }

  function computeStats(data, targetHours) {
    var now = new Date();
    var records = (data && data.records) || [];
    var bounds = dayBounds(now);

    var formulaAll = records.filter(function (r) { return r.type === 'Formula'; })
      .slice().sort(function (a, b) { return new Date(a.datetime) - new Date(b.datetime); });

    var ivStats = classifyIntervals(formulaAll);
    var lastFeedTime = formulaAll.length ? new Date(formulaAll[formulaAll.length - 1].datetime) : null;
    var isDayNow = lastFeedTime ? isDayHour(lastFeedTime.getHours()) : isDayHour(now.getHours());
    var chosenAvg = null;
    if (lastFeedTime) chosenAvg = isDayNow ? (ivStats.dayAvg != null ? ivStats.dayAvg : ivStats.overallAvg) : (ivStats.nightAvg != null ? ivStats.nightAvg : ivStats.overallAvg);

    var nextFeedTime = null, minutesUntilNext = null, overdue = false;
    if (lastFeedTime && chosenAvg) {
      nextFeedTime = new Date(lastFeedTime.getTime() + chosenAvg * 60000);
      minutesUntilNext = (nextFeedTime - now) / 60000;
      overdue = minutesUntilNext < 0;
    }

    function inToday(r) { var t = new Date(r.datetime); return t >= bounds.start && t < bounds.end; }
    var formulaToday = formulaAll.filter(inToday);
    var feedCountToday = formulaToday.length;
    var feedMlToday = formulaToday.reduce(function (s, r) { return s + ((r.value && typeof r.value.value === 'number') ? r.value.value : 0); }, 0);
    var peeCountToday = records.filter(function (r) { return r.type === 'Pee'; }).filter(inToday).length;
    var poopCountToday = records.filter(function (r) { return r.type === 'Poop'; }).filter(inToday).length;

    var sleepEvents = records.filter(function (r) { return r.type === 'Sleep' || r.type === 'WakeUp'; })
      .slice().sort(function (a, b) { return new Date(a.datetime) - new Date(b.datetime); });
    var intervals = []; var pendingSleep = null;
    sleepEvents.forEach(function (ev) {
      if (ev.type === 'Sleep') pendingSleep = new Date(ev.datetime);
      else if (ev.type === 'WakeUp' && pendingSleep) { intervals.push([pendingSleep, new Date(ev.datetime)]); pendingSleep = null; }
    });
    var ongoingSleep = false;
    if (pendingSleep) { intervals.push([pendingSleep, now]); ongoingSleep = true; }

    var sleepMsToday = 0;
    intervals.forEach(function (iv) {
      var s = iv[0] < bounds.start ? bounds.start : iv[0];
      var e = iv[1] > bounds.end ? bounds.end : iv[1];
      if (e > s) sleepMsToday += (e - s);
    });

    var lastSleepWakeEvent = sleepEvents.length ? sleepEvents[sleepEvents.length - 1] : null;
    var currentlyAsleep = lastSleepWakeEvent ? lastSleepWakeEvent.type === 'Sleep' : false;
    var sinceEventTime = lastSleepWakeEvent ? new Date(lastSleepWakeEvent.datetime) : null;
    var sinceEventMin = sinceEventTime ? (now - sinceEventTime) / 60000 : null;

    return {
      lastFeedTime: lastFeedTime, nextFeedTime: nextFeedTime, minutesUntilNext: minutesUntilNext, overdue: overdue,
      chosenAvg: chosenAvg, isDayNow: isDayNow, ivStats: ivStats,
      feedCountToday: feedCountToday, feedMlToday: feedMlToday,
      peeCountToday: peeCountToday, poopCountToday: poopCountToday,
      sleepMsToday: sleepMsToday, ongoingSleep: ongoingSleep, targetMs: targetHours * 3600000,
      currentlyAsleep: currentlyAsleep, sinceEventMin: sinceEventMin, hasSleepData: !!lastSleepWakeEvent,
      dayBounds: bounds, sleepIntervals: intervals,
      dayFormula: formulaToday,
      dayPee: records.filter(function (r) { return r.type === 'Pee'; }).filter(inToday),
      dayPoop: records.filter(function (r) { return r.type === 'Poop'; }).filter(inToday)
    };
  }

  function renderTimeline(stats) {
    var bounds = stats.dayBounds, now = new Date(), html = '';
    for (var h = 0; h < 24; h++) html += '<div class="hour-row" style="top:' + (h * ROW_H) + 'px;"><span class="hlabel">' + h + ':00</span></div>';
    stats.sleepIntervals.forEach(function (iv) {
      var s = iv[0] < bounds.start ? bounds.start : iv[0];
      var e = iv[1] > bounds.end ? bounds.end : iv[1];
      if (e <= s) return;
      var top = minutesSinceMidnight(s, bounds.start) / DAY_MIN * GRID_H;
      var h2 = Math.max(4, (minutesSinceMidnight(e, bounds.start) - minutesSinceMidnight(s, bounds.start)) / DAY_MIN * GRID_H);
      html += '<div class="sleep-block" style="left:46px; width:30px; top:' + top + 'px; height:' + h2 + 'px;" title="ねんね ' + fmtClock(s) + '〜' + fmtClock(e) + '"></div>';
    });
    function dot(list, cls, emoji, col) {
      list.forEach(function (r) {
        var t = new Date(r.datetime);
        var top = minutesSinceMidnight(t, bounds.start) / DAY_MIN * GRID_H;
        var detail = '';
        if (r.type === 'Formula' && r.value && r.value.value) detail = ' ' + r.value.value + 'ml';
        html += '<div class="evt-dot ' + cls + '" style="left:' + col + 'px; top:' + top + 'px;" title="' + fmtClock(t) + detail + '">' + emoji + '</div>';
      });
    }
    dot(stats.dayFormula, 'feed', '🍼', 90);
    dot(stats.dayPee, 'pee', '💧', 118);
    dot(stats.dayPoop, 'poop', '💩', 146);
    if (now >= bounds.start && now < bounds.end) {
      var nowTop = minutesSinceMidnight(now, bounds.start) / DAY_MIN * GRID_H;
      html += '<div class="now-line" style="top:' + nowTop + 'px;"></div>';
    }
    els.dayGrid.style.height = GRID_H + 'px';
    els.dayGrid.innerHTML = html;
  }
  function scrollTimelineToNow() {
    var now = new Date();
    var nowTop = minutesSinceMidnight(now, dayBounds(now).start) / DAY_MIN * GRID_H;
    els.dayGridScroll.scrollTop = Math.max(0, nowTop - els.dayGridScroll.clientHeight / 2);
  }

  function renderTrend() {
    var log = getAvgLog();
    var pts = log.filter(function (e) { return typeof e.day === 'number'; }).slice(-10);
    if (pts.length < 2) { els.trendRow.style.display = 'none'; return; }
    els.trendRow.style.display = 'flex';
    var vals = pts.map(function (p) { return p.day; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (min === max) { min -= 15; max += 15; }
    var w = 110, h = 28, pad = 4;
    var stepX = pts.length > 1 ? (w - 2 * pad) / (pts.length - 1) : 0;
    var coords = pts.map(function (p, i) {
      var x = pad + i * stepX;
      var y = h - pad - ((p.day - min) / (max - min)) * (h - 2 * pad);
      return [x, y];
    });
    var polyStr = coords.map(function (c) { return c[0] + ',' + c[1]; }).join(' ');
    var last = coords[coords.length - 1];
    var svgHtml = '<polyline points="' + polyStr + '" fill="none" stroke="var(--accent-feed)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3" fill="var(--accent-feed)"/>';
    els.trendSpark.innerHTML = svgHtml;
    var delta = pts[pts.length - 1].day - pts[0].day;
    var sign = delta >= 0 ? '+' : '−';
    els.trendDelta.innerHTML = '昼間隔の推移<br>' + sign + fmtHM(Math.abs(delta)) + '（' + pts.length + '日間）';
  }

  function render(stats) {
    els.stateArea.innerHTML = '';
    els.dashboard.style.display = '';
    els.todayLabel.textContent = fmtToday();

    els.feedTodayLine.innerHTML = '<strong>' + stats.feedCountToday + '回</strong>' + (stats.feedMlToday > 0 ? '・' + stats.feedMlToday + 'ml' : '');

    if (!stats.lastFeedTime) {
      els.ringBig.textContent = '記録なし'; els.ringSub.textContent = '直近のミルク記録なし';
      els.ringProgress.setAttribute('stroke-dashoffset', RING_CIRC); els.ringProgress.style.stroke = 'var(--accent-feed)';
      els.miniStats.style.display = 'none'; els.avgRow.style.display = 'none'; els.trendRow.style.display = 'none';
    } else if (!stats.chosenAvg) {
      els.ringBig.textContent = fmtClock(stats.lastFeedTime); els.ringSub.textContent = '前回のミルク';
      els.ringProgress.setAttribute('stroke-dashoffset', RING_CIRC); els.ringProgress.style.stroke = 'var(--accent-feed)';
      els.miniStats.style.display = 'none'; els.avgRow.style.display = 'none'; els.trendRow.style.display = 'none';
    } else {
      els.ringBig.textContent = fmtClock(stats.nextFeedTime); els.ringSub.textContent = '次回の目安';
      var frac = Math.min(1, Math.max(0, (Date.now() - stats.lastFeedTime.getTime()) / (stats.chosenAvg * 60000)));
      els.ringProgress.setAttribute('stroke-dashoffset', String(RING_CIRC * (1 - frac)));
      els.ringProgress.style.stroke = stats.overdue ? 'var(--danger)' : 'var(--accent-feed)';

      els.miniStats.style.display = '';
      els.lastTime.textContent = fmtClock(stats.lastFeedTime);
      els.lastElapsed.textContent = fmtHM((Date.now() - stats.lastFeedTime.getTime()) / 60000) + ' 経過';
      els.nextLabel.textContent = '次回の目安（' + (stats.isDayNow ? '昼' : '夜') + '）';
      els.nextTime.textContent = fmtClock(stats.nextFeedTime);
      if (stats.overdue) { els.nextSub.textContent = fmtHM(stats.minutesUntilNext) + ' 経過'; els.nextSub.className = 'm-sub danger'; els.nextStat.classList.add('overdue'); }
      else { els.nextSub.textContent = 'あと ' + fmtHM(stats.minutesUntilNext); els.nextSub.className = 'm-sub'; els.nextStat.classList.remove('overdue'); }

      els.avgRow.style.display = '';
      els.avgMain.innerHTML = (stats.isDayNow ? '昼' : '夜') + 'の目安間隔　<strong>' + fmtHM(stats.chosenAvg) + '</strong>';
      var dayTxt = stats.ivStats.dayAvg != null ? fmtHM(stats.ivStats.dayAvg) : 'データ不足';
      var nightTxt = stats.ivStats.nightAvg != null ? fmtHM(stats.ivStats.nightAvg) : 'データ不足';
      els.avgSub.textContent = '参考：昼 ' + dayTxt + '／夜 ' + nightTxt;

      upsertAvgLog(dateStr(new Date()), stats.ivStats.dayAvg, stats.ivStats.nightAvg);
      renderTrend();
    }

    els.peeNum.textContent = stats.peeCountToday + '回';
    els.poopNum.textContent = stats.poopCountToday + '回';

    var sleepHours = stats.sleepMsToday / 3600000, targetHours = stats.targetMs / 3600000;
    els.sleepTargetLabel.textContent = targetHours;
    var hDisp = Math.floor(sleepHours), mDisp = Math.round((sleepHours - hDisp) * 60);
    els.sleepVal.textContent = hDisp + '時間' + mDisp + '分';
    if (!stats.hasSleepData) {
      els.sleepStateLine.textContent = '記録なし';
      els.sleepStateLine.className = 'sleep-state awake';
    } else if (stats.currentlyAsleep) {
      els.sleepStateLine.textContent = '😴 寝てから ' + fmtHM(stats.sinceEventMin) + ' 経過';
      els.sleepStateLine.className = 'sleep-state asleep';
    } else {
      els.sleepStateLine.textContent = '起きてから ' + fmtHM(stats.sinceEventMin) + ' 経過';
      els.sleepStateLine.className = 'sleep-state awake';
    }
    els.sleepBar.style.width = Math.min(100, Math.max(0, (stats.sleepMsToday / stats.targetMs) * 100)) + '%';
    var remainMs = stats.targetMs - stats.sleepMsToday;
    els.sleepRemain.innerHTML = remainMs <= 0 ? '<strong>目標達成 ◎</strong>' : 'あと <strong>' + fmtHM(remainMs / 60000) + '</strong>';

    renderTimeline(stats);
    els.lastUpdated.textContent = '最終更新 ' + fmtClock(new Date());
  }

  function loadAndRender() {
    var url = getFeedUrl();
    if (!url) { openPanel(true); showState('データフィードのURLを設定すると、ここに記録が表示されます。'); return; }
    showState('読み込み中…');
    fetch(url, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) return res.json().catch(function () { return null; }).then(function (body) {
          throw new Error((body && body.error && body.error.message) || ('HTTPエラー: ' + res.status));
        });
        return res.json();
      })
      .then(function (data) { render(computeStats(data, getSleepTargetHours())); })
      .catch(function (err) {
        showState('記録を取得できませんでした。<br><span style="font-size:12px;">' + (err && err.message ? err.message : '通信エラー') +
          '</span><br><br><button class="refresh-btn" onclick="document.getElementById(\'settingsBtn\').click()">URLを確認する</button>');
      });
  }
  function scheduleRefresh() { if (refreshTimer) clearInterval(refreshTimer); refreshTimer = setInterval(loadAndRender, REFRESH_MS); }

  loadAndRender();
  scheduleRefresh();
})();
</script>
